name: Dependency config syntax

on:
  push:
    paths:
      - "renovate.json"
      - ".github/workflows/dependency-configs.yml"
  pull_request:
    paths:
      - "renovate.json"
      - ".github/workflows/dependency-configs.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate the Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install tooling
        run: pip install -r requirements_lint.txt

      - name: Validate renovate.json
        run: check-jsonschema --builtin-schema vendor.renovate --regex-variant nonunicode renovate.json
