name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install -r requirements_lint.txt

      - name: Run ruff check
        run: ruff check custom_components/

      - name: Run ruff format check
        run: ruff format --check custom_components/

  prettier:
    name: Prettier (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Prettier check
        run: npx prettier --check --config .prettierrc "src/**/*.{js,jsx,ts,tsx,json,css}"
        working-directory: frontend
